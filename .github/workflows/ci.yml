name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: 単体テスト
        run: npm test
      - name: 単体テスト(日本時間の環境で)
        run: npm test
        env:
          TZ: Asia/Tokyo
      - name: 画面のテストの準備
        run: npx playwright install --with-deps chromium
      - name: 画面のテスト(本番と同じビルドで確かめる)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  secret-scan:
    # 秘密の混入検査(ADR-0006)。リポジトリの全履歴を見る。見つかった値はログに出さない(--redact)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks(版を固定した公式のコンテナで動かす)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
