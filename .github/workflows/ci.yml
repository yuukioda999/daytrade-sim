name: CI

on:
  pull_request:
  push:
    branches: [main]

# 読み取りだけにする(秘密の検査で外部のコンテナを動かすため。PR #8 のセキュリティレビュー)
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: 単体テスト
        run: npm test
      - name: 単体テスト(日本時間の環境で)
        run: npm test
        env:
          TZ: Asia/Tokyo
      - name: 画面のテストの準備
        run: npx playwright install --with-deps chromium
      - name: 画面のテスト(本番と同じビルドで確かめる)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  secret-scan:
    # 秘密の混入検査(ADR-0006)。リポジトリの全履歴を見る。見つかった値はログに出さない(--redact)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 版と中身のハッシュ(digest)で固定した公式のコンテナ。更新は手作業(ADR-0006)
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GitHub のトークンを .git/config に残さない(外部のコンテナから読めないように)
          persist-credentials: false
      - name: 検査が働くことの確かめ(偽のキーを見つけ、値をログに出さず、テストのダミーは除外する)
        run: |
          set -u
          fake="PK$(openssl rand -hex 32 | tr 'a-f' 'A-F' | tr -dc 'A-Z0-9' | head -c 18)"
          work="$(mktemp -d)"
          git init -q "$work/leak" && cd "$work/leak"
          echo "ALPACA_KEY_ID=\"$fake\"" > config.txt
          git add . && git -c user.name=ci -c user.email=ci@example.invalid commit -qm leak && cd - >/dev/null
          set +e
          docker run --rm -v "$work/leak:/repo:ro" -v "$PWD/.gitleaks.toml:/config.toml:ro" "$GITLEAKS_IMAGE" \
            git /repo --config /config.toml --redact --verbose --exit-code 1 > "$work/leak.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "偽のキーを見つけられませんでした(終了コード $code)"; exit 1; fi
          if grep -q "$fake" "$work/leak.log"; then echo "見つけた値がログに出ています"; exit 1; fi
          git init -q "$work/dummy" && cd "$work/dummy"
          echo 'const KEY_ID = "PKTESTKEY0000000ABCD";' > dummy.test.ts
          git add . && git -c user.name=ci -c user.email=ci@example.invalid commit -qm dummy && cd - >/dev/null
          docker run --rm -v "$work/dummy:/repo:ro" -v "$PWD/.gitleaks.toml:/config.toml:ro" "$GITLEAKS_IMAGE" \
            git /repo --config /config.toml --redact --exit-code 1
          echo "偽のキーを見つけ、値は隠れ、テストのダミーは除外されました"
      - name: gitleaks でリポジトリの全履歴を調べる
        run: >-
          docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE"
          git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
      - name: 秘密を含みうるファイルがコミットされていないこと
        run: |
          found="$(git ls-files | grep -E '(^|/)data/|\.db$|\.sqlite|(^|/)\.env($|\.)|(^|/)\.e2e/' | grep -v '^\.env\.example$' || true)"
          if [ -n "$found" ]; then echo "コミットしてはいけないファイルがあります:"; echo "$found"; exit 1; fi
